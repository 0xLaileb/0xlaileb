name: profile-assets

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/**
      - .github/workflows/profile-assets.yml

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Render stats card
        env:
          # Optional STATS_TOKEN (read-only PAT) adds private repositories to the language map.
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || github.token }}
        run: python3 tools/profile_svg.py stats --user "${{ github.repository_owner }}" --out dist

      - name: Render contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?palette=github-light&color_snake=#8250df
            dist/snake-dark.svg?palette=github-dark&color_snake=#bc8cff

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          jekyll: false
          commit_message: "chore: update profile assets"
        env:
          GITHUB_TOKEN: ${{ github.token }}
